# nginx config INSIDE the frontend container.
# Its only job is to serve the compiled React bundle correctly.
# Routing between frontend and backend is handled by the edge proxy in
# nginx/nginx.conf, one layer up.

server {
    listen       80;
    server_name  _;
    root         /usr/share/nginx/html;
    index        index.html;

    # Compress text assets. Images and the already-compressed bundle hashes
    # gain nothing, so the type list is deliberately narrow.
    gzip              on;
    gzip_vary         on;
    gzip_min_length   1024;
    gzip_types        text/plain text/css application/javascript application/json image/svg+xml;

    # Vite fingerprints every asset filename (index-BuMTf2nv.js). A fingerprinted
    # file can never change under the same name, so it is safe to cache forever.
    location /assets/ {
        expires    1y;
        add_header Cache-Control "public, immutable";
        try_files  $uri =404;
    }

    # index.html must NEVER be cached - it is the file that points at the new
    # fingerprinted bundle after a deployment. Caching it is the classic reason
    # users keep seeing the old version after a successful deploy.
    location = /index.html {
        add_header Cache-Control "no-cache, no-store, must-revalidate";
        add_header Pragma "no-cache";
        expires    0;
    }

    # SPA fallback: React Router owns the URL space, so any unknown path has to
    # return index.html rather than a 404, or a refresh on /dashboard breaks.
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Lets the edge proxy and Docker probe this container cheaply.
    location = /nginx-health {
        access_log off;
        return 200 "ok\n";
        add_header Content-Type text/plain;
    }
}
