# =============================================================================
# FinTrack edge reverse proxy
# -----------------------------------------------------------------------------
# This is the ONLY container that publishes a port to the host. It is the
# single public entry point:
#
#        Internet :80
#              |
#            nginx
#              |
#      +-------+--------+
#      |                |
#      /              /api
#      |                |
#   frontend         backend
#   (static)        (Express)  --> postgres (never reachable from outside)
#
# Because the backend is only addressed by its service name on the internal
# docker network, it has no published port and cannot be reached directly from
# the internet. The EC2 security group only needs 80 (and 443 with TLS) open.
# =============================================================================

upstream fintrack_frontend {
    # "frontend" is the docker compose service name, resolved by Docker's
    # embedded DNS on the shared network.
    server frontend:80;
}

upstream fintrack_backend {
    server backend:5000;
}

# Basic abuse protection for the auth endpoints. 5 requests/second per IP with
# a burst of 10 is generous for a human and inconvenient for a password-guessing
# script.
limit_req_zone $binary_remote_addr zone=auth_limit:10m rate=5r/s;

server {
    listen      80;
    server_name _;

    # Do not advertise the nginx version in responses or error pages.
    server_tokens off;

    # Large enough for the JSON this API accepts, small enough to reject
    # oversized bodies at the edge rather than in Node.
    client_max_body_size 1m;

    access_log /var/log/nginx/fintrack.access.log;
    error_log  /var/log/nginx/fintrack.error.log warn;

    # --- Security headers ----------------------------------------------------
    add_header X-Content-Type-Options    "nosniff"          always;
    add_header X-Frame-Options           "SAMEORIGIN"       always;
    add_header Referrer-Policy           "strict-origin-when-cross-origin" always;
    add_header X-XSS-Protection          "1; mode=block"    always;

    # --- Backend API ---------------------------------------------------------
    location /api/ {
        proxy_pass http://fintrack_backend;

        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        # Without these the backend logs nginx's address as the client IP.
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection        "";

        proxy_connect_timeout 5s;
        proxy_send_timeout    30s;
        proxy_read_timeout    30s;
    }

    # Tighter rate limit on the credential endpoints specifically.
    location /api/auth/ {
        limit_req zone=auth_limit burst=10 nodelay;

        proxy_pass http://fintrack_backend;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection        "";
    }

    # --- Health --------------------------------------------------------------
    # Exposed publicly on purpose: the CD pipeline verifies the deployment by
    # calling http://<EC2-HOST>/health from the GitHub Actions runner. It
    # returns no user data.
    location = /health {
        proxy_pass http://fintrack_backend/health;
        proxy_set_header Host $host;
        access_log off;
    }

    # Proves the edge proxy itself is up, without depending on the backend.
    location = /nginx-health {
        access_log off;
        return 200 "nginx ok\n";
        add_header Content-Type text/plain;
    }

    # --- Frontend ------------------------------------------------------------
    # Everything else is the React app. The frontend container does its own
    # SPA fallback, so deep links such as /dashboard resolve correctly.
    location / {
        proxy_pass http://fintrack_frontend;

        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}

# =============================================================================
# HTTPS
# -----------------------------------------------------------------------------
# Out of scope for the demo (it needs a real domain name, which an EC2 public
# IP is not). Once a domain points at the instance:
#
#   sudo apt install certbot python3-certbot-nginx
#   sudo certbot --nginx -d fintrack.example.com
#
# certbot writes the TLS server block and a 301 redirect from :80 automatically.
# Open 443 in the security group at that point. The block below is the shape it
# produces, left commented so the configuration is complete and reviewable.
# =============================================================================
#
# server {
#     listen 443 ssl http2;
#     server_name fintrack.example.com;
#
#     ssl_certificate     /etc/letsencrypt/live/fintrack.example.com/fullchain.pem;
#     ssl_certificate_key /etc/letsencrypt/live/fintrack.example.com/privkey.pem;
#     ssl_protocols       TLSv1.2 TLSv1.3;
#
#     # ... identical location blocks to the :80 server above ...
# }
